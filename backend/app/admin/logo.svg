<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Hausgeist</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6A92"/>
      <stop offset=".55" stop-color="#3C4466"/>
      <stop offset="1" stop-color="#1F2A44"/>
    </linearGradient>
    <radialGradient id="warm" cx=".12" cy=".08" r=".7">
      <stop offset="0" stop-color="#E0A06E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E0A06E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".58" r=".42">
      <stop offset="0" stop-color="#FFB340" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#FFB340" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFB340" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEBCB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E1428" flood-opacity=".45"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#warm)"/>
    <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  </g>

  <g id="mark">
    <ellipse cx="256" cy="440" rx="92" ry="12" fill="#0B1020" opacity=".35"/>
    <path filter="url(#soft)" fill="url(#ghost)" stroke="url(#ghost)" stroke-width="28" stroke-linejoin="round"
          d="M256 122 L372 224 L372 360 Q343 412 314 360 Q285 412 256 360 Q227 412 198 360 Q169 412 140 360 L140 224 Z"/>
    <ellipse cx="222" cy="262" rx="15" ry="20" fill="#2A3550"/>
    <ellipse cx="290" cy="262" rx="15" ry="20" fill="#2A3550"/>
    <circle cx="227" cy="254" r="4.5" fill="#FFFFFF"/>
    <circle cx="295" cy="254" r="4.5" fill="#FFFFFF"/>
    <path d="M238 302 Q256 318 274 302" fill="none" stroke="#2A3550" stroke-width="7" stroke-linecap="round"/>
    <path fill="#FFB340" d="M404 104 Q407 124 426 127 Q407 130 404 150 Q401 130 382 127 Q401 124 404 104 Z"/>
    <path fill="#FFD28A" d="M112 150 Q114 162 125 164 Q114 166 112 178 Q110 166 99 164 Q110 162 112 150 Z"/>
  </g>
</svg>
